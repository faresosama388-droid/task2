<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>Task1 >> Fares Osama</title </head>

<body>
    <h1><u>Task1 >> الطلاب المتعثرين</u></h1>
    <script>
        class Student {
            constructor(id, name, grades, days) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.days = days;
            }

            calc() {
                let total = this.grades.reduce((x, y) => x + y, 0);
                return total / this.grades.length;
            }
        }

        const students = [
            new Student(101, "Ahmed Mohamed", [80, 85, 88], 90),
            new Student(102, "Sara Ali", [70, 72, 73], 80),
            new Student(103, "Fares Osama", [42, 45, 48], 78),
            new Student(104, "Laila ali", [30, 35, 40], 60)
        ];

        const X = students.filter(s => {
            let num = s.calc();
            return num >= 40 && num <= 49;
        });

        const Y = X.map(s => {
            return s.calc() + 5;
        });

        const T = Y.reduce((sum, g) => sum + g, 0);

        let A = 0;
        if (X.length > 0) {
            A = T / X.length;
        }

        console.log("المتعثرين:", X);
        console.log("المتوسط  بعد الاضافة:", A.toFixed(2));
    </script>

</body>

</html>
