<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>Task2 >> Fares Osama</title>
</head>

<body>
    <h1><u>Task 2 >>محلل درجات الطلاب</u></h1>
    <script>
        class Student {
            constructor(id, name, grades, days) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.days = days;
            }

            calc() {
                let total = this.grades.reduce((x, y) => x + y, 0);
                return total / this.grades.length;
            }

            check(score) {
                if (score >= 85) return 'A';
                if (score >= 75) return 'B';
                if (score >= 65) return 'C';
                if (score >= 50) return 'D';
                if (score >= 40) return 'E';
                return 'F';
            }

            status() {
                let avg = this.calc();
                if (avg >= 50 && this.days >= 75) {
                    return "ناجح";
                } else {
                    return "تحت المراجعه";
                }
            }
        }

        const data = [
            new Student(101, "Ahmed Mohamed", [80, 85, 88], 90),
            new Student(102, "Sara Ali", [70, 72, 73], 80),
            new Student(103, "Fares Osama", [42, 45, 48], 78),
            new Student(104, "Laila Ahmed", [30, 35, 40], 60)
        ];

        data.forEach(s => {
            let num = s.calc();
            console.log("الاسم:", s.name, "| المتوسط:", num.toFixed(2), "| التقدير:", s.check(num), "| النتيجة:", s.status());
        });
    </script>
</body>

</html>
